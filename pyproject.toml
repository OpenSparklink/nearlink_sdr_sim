[project]
name = "nearlink-sdr"
version = "0.1.0"
description = "SparkLink SLE PHY/MAC link-level simulation conforming to TXS-10002-2025"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "scipy>=1.17.1",
    "attrs>=24.3.0",
    "cattrs>=23.1.2",
    "lsprotocol==2025.0.0",
    "cryptography>=45.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    {include-group = "docs"},
]
docs = [
    "sphinx>=8.0,<9.0",
    "myst-parser>=4.0",
    "sphinx-rtd-theme>=3.0",
    "sphinx-autodoc2>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nearlink_sdr"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # 行长度由 line-length 控制
    "RUF002", # 允许中文全角标点
    "RUF003", # 允许中文注释中的 CJK 字符
    "B023",   # 允许闭包中引用循环变量 (仿真代码常用)
]

[tool.ruff.lint.isort]
known-first-party = ["nearlink_sdr"]

[tool.esbonio.sphinx]
pythonCommand = ["uv", "run", "--group", "docs", "python"]