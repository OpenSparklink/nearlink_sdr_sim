name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group docs

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended \
            texlive-latex-extra texlive-latex-recommended texlive-lang-chinese \
            latexmk

      - name: Install HarmonyOS fonts
        run: make install-fonts

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mermaid CLI
        run: npm install

      - name: Build Chinese PDF
        run: make docs-pdf

      - name: Build English PDF
        run: make docs-pdf-en

      - name: Build Chinese HTML
        run: uv run sphinx-build -b html docs docs/_build/html

      - name: Build English HTML
        run: |
          uv run sphinx-intl build -d docs/locales
          uv run sphinx-build -b html -D language=en docs docs/_build/html_en

      - name: Package HTML docs
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cd docs/_build/html && tar czf "../../../nearlink-sdr-docs-zh-${TAG}.tar.gz" --exclude='.doctrees' .
          cd ../../..
          cd docs/_build/html_en && tar czf "../../../nearlink-sdr-docs-en-${TAG}.tar.gz" --exclude='.doctrees' .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            docs/_build/latex/nearlink-sdr.pdf
            docs/_build/latex_en/nearlink-sdr.pdf
            nearlink-sdr-docs-zh-*.tar.gz
            nearlink-sdr-docs-en-*.tar.gz

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/

      - name: Rename PDF files
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mv dist/docs/_build/latex/nearlink-sdr.pdf "dist/nearlink-sdr-zh-${TAG}.pdf"
          mv dist/docs/_build/latex_en/nearlink-sdr.pdf "dist/nearlink-sdr-en-${TAG}.pdf"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/nearlink-sdr-zh-*.pdf
            dist/nearlink-sdr-en-*.pdf
            dist/nearlink-sdr-docs-zh-*.tar.gz
            dist/nearlink-sdr-docs-en-*.tar.gz
